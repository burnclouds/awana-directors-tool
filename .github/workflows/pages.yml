# Publishes deploy/ (built by make-deploy.sh and committed) to GitHub Pages.
# Nothing is built here: the committed deploy/ folder is the site. The node tests run first (see the test job).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A deploy in progress is never cancelled by a newer push: the newer one waits and then publishes.
  group: pages
  cancel-in-progress: false

jobs:
  # N9.1: the node tests run first and must pass before the site is published (a failing test stops the deploy). Gate turned on 2026-11-19 after the first green run on GitHub.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # N9 point 1: strict deploy check, so a stale deploy/ fails here whatever the CHANGELOG says (release-consistency.test.js).
      - run: sh dev/tools/run-tests.sh --node-only
        env:
          AWANA_STRICT_DEPLOY: 1
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # N9 point 7: a record of each deploy on the run's summary page: commit, version, build, the source the page was built from, and the test job's result.
      - name: Record this deploy
        env:
          COMMIT: ${{ github.sha }}
          TESTS: ${{ needs.test.result }}
        run: |
          {
            echo "## Deploy record"
            echo "- Commit: $COMMIT"
            echo "- Version: $(sed -n 's/.*name="app-version" content="\([^"]*\)".*/\1/p' deploy/app/index.html | head -1)"
            echo "- Build: $(sed -n 's/.*name="app-build" content="\([^"]*\)".*/\1/p' deploy/app/index.html | head -1)"
            echo "- Built from: $(sed -n 's/.*name="app-source" content="\([^"]*\)".*/\1/p' deploy/app/index.html | head -1)"
            echo "- Node tests (test job): $TESTS"
          } >> "$GITHUB_STEP_SUMMARY"
      # Each attempt has its own artifact name, so a rerun can never find two uploads with the same name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
          name: github-pages-${{ github.run_attempt }}
      # GitHub's Pages service fails intermittently ("Fetching artifact metadata failed"). Try the deploy again with the same upload, not a new one.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the last retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 180
      - id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # The page URL comes from whichever attempt succeeded.
      - name: Check the deploy succeeded
        if: always()
        env:
          A: ${{ steps.deployment.outcome }}
          B: ${{ steps.deployment_retry_1.outcome }}
          C: ${{ steps.deployment_retry_2.outcome }}
        run: |
          echo "attempts: first=$A retry1=$B retry2=$C"
          if [ "$A" = success ] || [ "$B" = success ] || [ "$C" = success ]; then exit 0; fi
          echo "Deploy failed on all attempts. Upload is kept; start a fresh run, not a rerun." >&2
          exit 1
