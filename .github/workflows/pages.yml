# Publishes deploy/ (built by make-deploy.sh and committed) to GitHub Pages.
# Nothing is built here: the committed deploy/ folder is the site. The node tests run first (see the test job).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # N9.1: the node tests run before the site is published. continue-on-error keeps this a warning for now: it was proven in a clean copy of the repository (97 ok, 0 failed with --node-only) but not yet on GitHub's own runner. After the first green run, delete the continue-on-error line and it becomes a gate. The browser (Playwright) tests are not run here.
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # N9 point 1: strict deploy check, so a stale deploy/ fails here whatever the CHANGELOG says (release-consistency.test.js).
      - run: sh dev/tools/run-tests.sh --node-only
        env:
          AWANA_STRICT_DEPLOY: 1
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # N9 point 7: a record of each deploy on the run's summary page: commit, version, build, the source the page was built from, and the test job's result.
      - name: Record this deploy
        env:
          COMMIT: ${{ github.sha }}
          TESTS: ${{ needs.test.result }}
        run: |
          {
            echo "## Deploy record"
            echo "- Commit: $COMMIT"
            echo "- Version: $(sed -n 's/.*name="app-version" content="\([^"]*\)".*/\1/p' deploy/app/index.html | head -1)"
            echo "- Build: $(sed -n 's/.*name="app-build" content="\([^"]*\)".*/\1/p' deploy/app/index.html | head -1)"
            echo "- Built from: $(sed -n 's/.*name="app-source" content="\([^"]*\)".*/\1/p' deploy/app/index.html | head -1)"
            echo "- Node tests (test job): $TESTS"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - id: deployment
        uses: actions/deploy-pages@v4
